<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>변화와 항상성의 역설적 동시성 | 공덕선생</title>
  <style>
    :root {
      --bg: #f7f5f0;
      --text: #2c2c2c;
      --accent: #7a6a52;
      --link: #4a6741;
      --border: #d9d4c8;
      --muted: #9a9080;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nanum Myeongjo', 'Georgia', serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.95;
      padding: 2rem 1rem;
    }
    .container {
      max-width: 740px;
      margin: 0 auto;
    }
    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.2rem;
      margin-bottom: 2rem;
    }
    header h1 {
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.03em;
    }
    header p {
      font-size: 0.88rem;
      color: var(--muted);
      margin-top: 0.3rem;
    }

    /* ── Notion 링크 블록 ── */
    .notion-link-block {
      margin: 2rem 0;
      padding: 1.2rem 1.5rem;
      background: #fff;
      border-left: 4px solid var(--accent);
      border-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .notion-link-block a {
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--link);
      text-decoration: none;
      letter-spacing: 0.02em;
    }
    .notion-link-block a:hover {
      text-decoration: underline;
    }
    .notion-link-block .sub {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 0.3rem;
    }

    /* ── 본문 영역 ── */
    main {
      margin: 2rem 0;
      font-size: 1rem;
      color: var(--text);
    }
    main p {
      margin-bottom: 1.2rem;
    }

    /* ── 하단 링크 & 저작권 ── */
    .bottom-nav {
      margin-top: 3rem;
      padding-top: 1.2rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.8rem;
    }
    .bottom-nav a {
      font-size: 0.92rem;
      color: var(--link);
      text-decoration: none;
      font-weight: 600;
    }
    .bottom-nav a:hover { text-decoration: underline; }

    footer {
      margin-top: 1.6rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
      padding-bottom: 2rem;
    }
  </style>
</head>
<body>
<div class="container">

  <header>
    <h1>변화와 항상성의 역설적 동시성</h1>
    <p>공덕선생의 철학 수양록 · axis 7</p>
  </header>

  <!-- 1. 노션 임베드 링크 블록 -->
  <div class="notion-link-block">
    <a href="https://app.notion.com/p/c5d9f8a45c8b4e00b87cf5f41d586a6d"
       target="_blank" rel="noopener noreferrer">
      📖 변화와 항상성의 역설적 동시성 — 노션 전문 보기
    </a>
    <p class="sub">Notion 페이지로 이동합니다 (새 탭)</p>
  </div>

  <!-- 본문 영역: 기존 내용을 이 아래에 붙여 넣으세요 -->
  <main>
    <p>이 공간에 기존 본문 내용을 그대로 붙여 넣어 주세요.</p>
  </main>

  <!-- 2. 처음으로 링크 + 3. 저작권 문구 -->
  <div class="bottom-nav">
    <a href="https://chan-61.github.io/kchan/">← 처음으로</a>
    <span style="font-size:0.82rem; color:#9a9080;">axis 7</span>
  </div>

  <footer>
    © 변화-항상성-동시성 실천 철학 수양록
  </footer>

</div>
</body>
</html>
